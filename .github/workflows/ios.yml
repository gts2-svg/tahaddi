name: ios

# يبني تطبيق الآيفون والآيباد الأصلي (SwiftUI) للمحاكي، ويشغّل فحوص المنطق داخله، ويصوّر شاشاته
# بوضع التصوير (-shot) على آيفون عمودياً وآيباد أفقياً، ويرفع الصور إلى فرع ios-screens.
# لا ينشر شيئاً للتثبيت؛ الرفع إلى TestFlight من مستودع anthima.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      SHOTS: "home settings teams splash question answered steal whoami clubs poem board result"
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate project
        run: |
          ios/build_web.sh
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tahaddi.xcodeproj -scheme Tahaddi -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          echo "warnings: $(grep -c 'warning:' build.log || true)"
          grep -E "warning:" build.log | grep "/App/" | sort -u | head -40 || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E -A6 "error:" build.log | head -250; exit 1; }

      - name: Screenshots
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -name "Tahaddi.app" -maxdepth 3 | head -1)
          # للتصوير فقط (لا يمس بناء TestFlight): ملء الشاشة في الآيباد حتى يقبل النظام طلب الوضع الأفقي
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$APP/Info.plist" || true
          mkdir -p "$RUNNER_TEMP/shots"
          : > "$RUNNER_TEMP/problems.txt"
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json,sys
          want=sys.argv[1]
          c=[x for k,v in json.load(sys.stdin)['devices'].items() if 'iOS' in k for x in v]
          if want=='ipad':
              m=[x for x in c if x['name']=='iPad (A16)'] or [x for x in c if x['name'].startswith('iPad') and 'Pro' not in x['name']] or [x for x in c if x['name'].startswith('iPad')]
          else:
              m=[x for x in c if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(m[-1]['udid']+' '+m[-1]['name'])
          " "$1"
          }
          shoot() {
            read U N <<< "$(pick $1)"; echo "== $1: $N"
            xcrun simctl boot "$U"; xcrun simctl bootstatus "$U" -b > /dev/null
            xcrun simctl status_bar "$U" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3
            xcrun simctl install "$U" "$APP"
            # بلا شاشة تعريف «الكتابة بالسحب» فوق لوحة المفاتيح
            for d in com.apple.Preferences com.apple.keyboard.preferences; do
              xcrun simctl spawn "$U" defaults write $d DidShowContinuousPathIntroduction -bool true || true
            done
            DOCS="$(xcrun simctl get_app_container "$U" com.gts2svg.tahaddi data)/Documents"
            if [ "$1" = iphone ]; then
              xcrun simctl launch "$U" com.gts2svg.tahaddi -selfcheck > /dev/null
              sleep 10
              echo "---- selfcheck"
              cat "$(xcrun simctl get_app_container "$U" com.gts2svg.tahaddi data)/Documents/selfcheck.txt" || echo "no selfcheck output"
              grep -q "SELFCHECK OK" "$(xcrun simctl get_app_container "$U" com.gts2svg.tahaddi data)/Documents/selfcheck.txt" 2>/dev/null || echo "selfcheck failed" >> "$RUNNER_TEMP/problems.txt"
            fi
            i=0
            for s in $SHOTS; do
              i=$((i+1))
              xcrun simctl terminate "$U" com.gts2svg.tahaddi > /dev/null 2>&1 || true
              rm -f "$DOCS/shot-ready.txt"
              PID=$(xcrun simctl launch "$U" com.gts2svg.tahaddi -shot "$s" | awk '{print $NF}')
              # ينتظر علامة الجاهزية التي يكتبها التطبيق بعد تجهيز الشاشة (حتى 45 ثانية)
              for w in $(seq 1 90); do [ -f "$DOCS/shot-ready.txt" ] && break; sleep 0.5; done
              [ -f "$DOCS/shot-ready.txt" ] || echo "::warning::$1 $s: no ready marker"
              if [ $i -eq 1 ]; then sleep 10; else sleep 1.5; fi
              F="$RUNNER_TEMP/shots/$1-$(printf %02d $i)-$s.png"
              xcrun simctl io "$U" screenshot "$F" > /dev/null
              if ! ps -p "$PID" > /dev/null 2>&1; then echo "::error::$1 $s: the app quit"; echo "$1 $s crashed" >> "$RUNNER_TEMP/problems.txt"; fi
            done
            echo "orientation log: $(cat "$DOCS/orient.txt" 2>/dev/null)"
            xcrun simctl shutdown "$U" || true
          }
          shoot iphone
          shoot ipad
          ls -la "$RUNNER_TEMP/shots"
          echo "---- crash reports"
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i tahaddi | head || true
          for f in $(ls ~/Library/Logs/DiagnosticReports/Tahaddi* 2>/dev/null | head -2); do head -120 "$f"; done

      - name: Publish screenshots to the ios-screens branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          ls "$RUNNER_TEMP"/shots/*.png > /dev/null 2>&1 || exit 0
          mkdir -p "$RUNNER_TEMP/screens" && cd "$RUNNER_TEMP/screens"
          git init -q -b ios-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp "$RUNNER_TEMP"/shots/*.png .
          git add *.png
          git commit -q -m "ios screenshots for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-screens

      - name: Check the app stayed open
        run: |
          if [ -s "$RUNNER_TEMP/problems.txt" ]; then cat "$RUNNER_TEMP/problems.txt"; exit 1; fi
